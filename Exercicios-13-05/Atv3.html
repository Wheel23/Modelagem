<!-- Exercício 3: Layout de mini cartão de perfil-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
</head>
<body>
    <div class="card">
        <h2>Maria Oliveira</h2>
        <p>Desenvolvedora Front-end</p>
        <button>Seguir</button>
      </div>
      <style>
        .card{
            background-color: white;
            border: lightgrey solid;
            border-radius: 10px;
            box-shadow: 1px 3px 7px 1px;
            text-align: center;
            align-items: center;

        }

        .card button{
            background-color: aliceblue;
            border: none;
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
        }

        .card button:hover{
            background-color: rgba(211, 211, 211, 0.63);
            transition: 0.3s;
        }
        
        </style>      
</body>
</html>
