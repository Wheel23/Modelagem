<!--Exercício 4: Menu de Navegação Horizontal-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4</title>
</head>
<body>
    <nav class="menu">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Serviços</a>
        <a href="#">Contato</a>
    </nav>
    <style>
        .menu{
            display: flex;
        }

        .menu a{
            text-decoration: none;
            margin: 10px;
            color: blueviolet;
        }

        .menu a:hover{
            transition: 0.4s;
            color: rgb(81, 52, 109);
        }
    </style>      
</body>
</html>
