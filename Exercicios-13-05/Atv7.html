<!--Exercício 7: Criar uma Tabela Estilizada-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>
</head>
<body>
    <table class="tabela-notas">
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Nota</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ana</td>
            <td>9.5</td>
          </tr>
          <tr>
            <td>Bruno</td>
            <td>8.0</td>
          </tr>
          <tr>
            <td>Clara</td>
            <td>7.8</td>
          </tr>
        </tbody>
      </table>
      
      <style>
        
        .tabela-notas {
          border-collapse: collapse; 
          width: 100%; 
        }
      
       
        .tabela-notas th, .tabela-notas td {
          border: 1px solid #ddd; 
          padding: 8px; 
          text-align: center; 
        }
      
        
        .tabela-notas thead {
          background-color: #f2f2f2; 
        }
      
       
        .tabela-notas tr:hover {
          background-color: #e0e0e0; 
        }
      </style>
      
</body>
</html>
