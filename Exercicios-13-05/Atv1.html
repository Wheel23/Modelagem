<!--Exercício 1: Crie um botão estilizado-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1</title>
</head>
<body>
    <button id="button">Clique aqui</button>
    <style>
        .body{
            align-items: center;
            align-content: center;
            justify-content: center;
        }

        #button{
            background-color: green;
            color: white;
            border-radius: 10px;
            border: none;
            justify-content: center;
            display: flex;
            margin: 0px;
            padding: 10px;
        }

        #button:hover{
            background-color: rgb(3, 70, 3);
            transition: 0.4s;
        }
    </style>
</body>
</html>
