<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: antiquewhite;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            overflow: hidden; /* Evitar overflow do body */
        }

        .container {
            background: aquamarine;
            margin: 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 1px 4px 2px;
            text-align: center;
            overflow-y: auto; /* Permite rolagem vertical */
            max-height: 90vh; /* Limita a altura da caixa, evitando ultrapassar a tela */
            width: 100%;
            max-width: 350px; /* Evita que o contêiner se expanda horizontalmente demais */
        }

        .container p {
            display: flex;
            padding: 20px;
        }

        .imagem-pokemon {
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 12px 3px;
            object-fit: contain;
        }

        .info-pokemon {
            font-size: 18px;
            color: beige;
        }

        .info-pokemon p {
            margin: 6px 0;
        }

        .fita-tipo {
            display: inline-block;
            background-color: aquamarine;
            color: white;
            padding: 5px 12px;
            border-radius: 14px;
            margin-top: 8px;
        }

        .area-busca {
            margin-top: 20px;
        }

        .area-busca input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .area-busca button {
            padding: 8px 12px;
            background-color: antiquewhite;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .area-busca button:hover {
            background-color: aliceblue;
            transform: scale(1.05);
        }

        .chip-tipo {
            display: inline-block;
            margin: 5px;
            background-color: #ddd;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .estatisticas {
            margin-top: 20px;
            text-align: left;
        }

    </style>
</head>
<body>
    <!-- Cartão principal do pokedéx-->
    <div class="container">
        <h1>Pokedéx</h1>
        <img class="imagem-pokemon" id="imagem" src="http://via.placeholder.com/150" alt="Imagem do pokemon">
        
        <div class="icon-pokemon">
            <p><strong>Nome:</strong></p> <span id="nome">----</span>
            <p><strong>Tipo:</strong></p> <span id="tipo">----</span>
            <p><strong>Número:</strong></p> <span id="numero">----</span>
            <p><strong>Peso:</strong> <span id="peso">---</span></p>
            <p><strong>Altura:</strong> <span id="altura">---</span></p>
        </div>

        <div class="estatisticas">
            <h3>Estatísticas:</h3>
            <p><strong>HP:</strong> <span id="hp">----</span></p>
            <p><strong>Ataque:</strong> <span id="ataque">----</span></p>
            <p><strong>Defesa:</strong> <span id="defesa">----</span></p>
            <p><strong>Velocidade:</strong> <span id="velocidade">----</span></p>
        </div>

        <div class="habilidades">
            <h3>Habilidades:</h3>
            <p id="habilidades">----</p>
        </div>

        <div class="area-busca">
            <input type="text" id="entrada" placeholder="Digite o nome do pokémon...">
            <button id="botao-busca">Buscar</button>
        </div>
    </div>

    <script>
        const botaoBuscar = document.getElementById('botao-busca');
        const campoEntrada = document.getElementById('entrada');

        botaoBuscar.addEventListener("click", async () => {
            const buscar = campoEntrada.value.toLowerCase().trim();
            if (!buscar) { 
                return;
            } 
            try {
                const resposta = await fetch(`https://pokeapi.co/api/v2/pokemon/${buscar}`);
                if (!resposta.ok) throw new Error('Pokemon não encontrado!');
                
                const dados = await resposta.json();
                
                document.getElementById('nome').textContent = dados.name;
                document.getElementById('numero').textContent = `${dados.id}`;
                document.getElementById('imagem').src = dados.sprites.front_default;
                document.getElementById('peso').textContent = `${dados.weight / 10} kg`;
                document.getElementById('altura').textContent = `${dados.height / 10} m`;

                // Exibir tipos
                const tipos = document.getElementById('tipo');
                tipos.innerHTML = '';
                dados.types.forEach(tipoInfo => {
                    const tipo = tipoInfo.type.name;
                    const chip = document.createElement('span');
                    chip.className = 'chip-tipo';
                    chip.textContent = tipo;
                    chip.style.backgroundColor = corDoTipo(tipo);
                    tipos.appendChild(chip);
                });

                // Exibir estatísticas
                document.getElementById('hp').textContent = dados.stats[0].base_stat;
                document.getElementById('ataque').textContent = dados.stats[1].base_stat;
                document.getElementById('defesa').textContent = dados.stats[2].base_stat;
                document.getElementById('velocidade').textContent = dados.stats[5].base_stat;

                // Exibir habilidades
                const habilidades = document.getElementById('habilidades');
                habilidades.innerHTML = '';
                dados.abilities.forEach(habilidade => {
                    const habilidadeElemento = document.createElement('span');
                    habilidadeElemento.textContent = habilidade.ability.name;
                    habilidadeElemento.className = 'chip-tipo';
                    habilidades.appendChild(habilidadeElemento);
                });
                
            } catch (error) {
                alert(error.message);
            }

            function corDoTipo(tipo) {
                const cores = {
                    fire: "#f94144",
                    water: "#577590",
                    grass: "#43aa8b",
                    electric: "#f9c74f",
                    bug: "#90be6d",
                    normal: "#adb5bd",
                    poison: "#9d4edd",
                    ground: "#74a261",
                    psychic: "#f72585",
                    fighting: "#d00000",
                    rock: "#6c584c",
                    ghost: "#8338ec",
                    dragon: "#3a0ca3",
                    dark: "#2d3142",
                    ice: "#a8dadc",
                    fairy: "#ffafcc",
                    flying: "#48cae4",
                    steel: "#8d99ae"
                }
                return cores[tipo] || "#888";
            }
        });
    </script>
</body>
</html>
