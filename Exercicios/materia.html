<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Matérias</title>
</head>
<body>
    <h2>Horários de Aula</h2>
    <table border="1">
        <tr>
            <th>Dia da Semana</th>
            <th>Matéria</th>
            <th>Horário</th>
        </tr>
        <tr>
            <td>Segunda-feira</td>
            <td>Matemática</td>
            <td>08:00 - 09:30</td>
        </tr>
        <tr>
            <td>Terça-feira</td>
            <td>Português</td>
            <td>10:00 - 11:30</td>
        </tr>
        <tr>
            <td>Quarta-feira</td>
            <td>História</td>
            <td>13:00 - 14:30</td>
        </tr>
        <tr>
            <td>Quinta-feira</td>
            <td>Ciências</td>
            <td>08:00 - 09:30</td>
        </tr>
        <tr>
            <td>Sexta-feira</td>
            <td>Educação Física</td>
            <td>10:00 - 11:30</td>
        </tr>
    </table>
</body>
</html>
