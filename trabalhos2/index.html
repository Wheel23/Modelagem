<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: antiquewhite;
            font-family: 'Press Start 2p', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: aquamarine;
            margin: 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 1px 4px 2px;
            text-align: center;
            overflow: hidden;
        }

        .container p{
            display: flex;
            padding: 20px;
        }

        .imagem-pokemon{
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 12px 3px;
            object-fit: contain;
        }

        .info-pokemon{
            font-size: 18px;
            color: beige;
        }

        .info-pokemon p{
            margin: 6px 0;
        }

        .fita-tipo{
            display: inline-block;
            background-color: aquamarine;
            color: white;
            padding: 5px 12px;
            border-radius: 14px;
            margin-top: 8px;
        }

        .area-busca{
            margin-top: 20px;
        }

        .area-busca input{
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            font-size: 14px;
        }

       


    
    </style>


</head>
<body>
    <!-- Cartão principal do pokedéx-->
     <div class="container">
        <h1>Pokedéx</h1>
        <img class="imagem-pokemon" src="http://via.placeholder.com/150" alt="Imagem do pokemon">
        
        <div class="icon-pokemon">
            
        <p><strong>Nome:</strong></p> <span id="nome">----</span>
        <p><strong>Tipo:</strong></p> <span id="tipo">----</span>
        <p><strong>Número:</strong></p> <span id="numero">----</span>
    </div>

    <div class="area-busca">
        <input type="text" id="entrada" placeholder="Digite o nome do pokémon...">
        <button id="botao-busca">Buscar</button>

    </div>

     </div>
</body>
</html>
